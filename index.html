<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form Example</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="bg-light p-4 d-flex justify-content-center">

    <div class="container" style="max-width: 900px;">
        <div class="card shadow-sm">
            <div class="card-header bg-white border-bottom-0 pt-3 pb-2">
                <h4 class="mb-0">Checkout Form</h4>
            </div>
            
            <div class="card-body border-top">
                <div id="statusAlert" class="alert alert-danger" role="alert">
                    Some fields are missing
                </div>
                
                <form id="paymentForm">
                    <div class="row mb-3">
                        <div class="col-md-5">
                            <label for="card" class="form-label">Card #</label>
                            <input type="text" class="form-control" id="card" placeholder="XXXXXXXXXXXXXXXXXX">
                        </div>
                        <div class="col-md-3">
                            <label for="cvc" class="form-label">CVC #</label>
                            <input type="text" class="form-control" id="cvc" placeholder="0000">
                        </div>
                        <div class="col-md-4">
                            <label for="amount" class="form-label">Amount</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 fw-bold">€</span>
                                <input type="text" class="form-control border-start-0 ps-0" id="amount" placeholder="Amount">
                            </div>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="firstName" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="firstName">
                        </div>
                        <div class="col-md-6">
                            <label for="lastName" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="lastName">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="city" class="form-label">City</label>
                            <input type="text" class="form-control" id="city">
                        </div>
                        <div class="col-md-3">
                            <label for="state" class="form-label">Province</label>
                            <select id="state" class="form-select text-secondary">
                                <option selected>Pick a Province</option>
                                <option value="VI">Álava</option>
                                <option value="AB">Albacete</option>
                                <option value="A">Alicante</option>
                                <option value="AL">Almería</option>
                                <option value="O">Asturias</option>
                                <option value="AV">Ávila</option>
                                <option value="BA">Badajoz</option>
                                <option value="PM">Baleares</option>
                                <option value="B">Barcelona</option>
                                <option value="BU">Burgos</option>
                                <option value="CC">Cáceres</option>
                                <option value="CA">Cádiz</option>
                                <option value="S">Cantabria</option>
                                <option value="CS">Castellón</option>
                                <option value="CE">Ceuta</option>
                                <option value="CR">Ciudad Real</option>
                                <option value="CO">Córdoba</option>
                                <option value="CU">Cuenca</option>
                                <option value="GI">Girona</option>
                                <option value="GR">Granada</option>
                                <option value="GU">Guadalajara</option>
                                <option value="SS">Guipúzcoa</option>
                                <option value="H">Huelva</option>
                                <option value="HU">Huesca</option>
                                <option value="J">Jaén</option>
                                <option value="LO">La Rioja</option>
                                <option value="GC">Las Palmas</option>
                                <option value="LE">León</option>
                                <option value="L">Lleida</option>
                                <option value="LU">Lugo</option>
                                <option value="M">Madrid</option>
                                <option value="MA">Málaga</option>
                                <option value="ML">Melilla</option>
                                <option value="MU">Murcia</option>
                                <option value="NA">Navarra</option>
                                <option value="OR">Ourense</option>
                                <option value="P">Palencia</option>
                                <option value="PO">Pontevedra</option>
                                <option value="SA">Salamanca</option>
                                <option value="TF">Santa Cruz de Tenerife</option>
                                <option value="SG">Segovia</option>
                                <option value="SE">Sevilla</option>
                                <option value="SO">Soria</option>
                                <option value="T">Tarragona</option>
                                <option value="TE">Teruel</option>
                                <option value="TO">Toledo</option>
                                <option value="V">Valencia</option>
                                <option value="VA">Valladolid</option>
                                <option value="BI">Vizcaya</option>
                                <option value="ZA">Zamora</option>
                                <option value="Z">Zaragoza</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label for="postalCode" class="form-label">Postal Code</label>
                            <input type="text" class="form-control" id="postalCode">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label class="form-label">We accept:</label>
                            <br>
                            <div class="payment-methods">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="mastercard" value="mastercard">
                                    <label class="form-check-label" for="mastercard">
                                        <i class="fa-brands fa-cc-mastercard fa-lg"></i>
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="visa" value="visa">
                                    <label class="form-check-label" for="visa">
                                        <i class="fa-brands fa-cc-visa fa-lg"></i>
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="diners" value="diners">
                                    <label class="form-check-label" for="diners">
                                        <i class="fa-brands fa-cc-diners-club fa-lg"></i>
                                    </label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" name="paymentMethod" id="amex" value="amex">
                                    <label class="form-check-label" for="amex">
                                        <i class="fa-brands fa-cc-amex fa-lg"></i>
                                    </label>
                                </div>
                            </div>  
                        </div>
                        <div class="col-md-6">
                            <label for="message" class="form-label">Message</label>
                            <textarea class="form-control" id="message" rows="3"></textarea>
                            <div class="form-text text-secondary">Add any notes here. (Optional)</div>
                        </div>
                    </div>
                </form>
            </div>
            
            <div class="card-footer bg-light d-flex justify-content-end gap-2 py-3">
                <button type="button" class="btn btn-secondary">Cancel</button>
                <button type="button" class="btn btn-primary">Send</button>
            </div>
        </div>
    </div>

 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Validation Script -->
  <script src="app.js"></script>
</body>
</html>
